services:
  backend:
    build:
      context: ./backend/AIChat.Api
      dockerfile: Dockerfile
    container_name: aichat-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_OPENAI_API_KEY}
    volumes:
      # Named volume: on first creation Docker populates it from the image's /app/config.
      # Edits persist across restarts. To reset to image defaults: docker compose down -v.
      # To edit: docker compose exec backend sh  (vi is not in the image; see README for details).
      - aichat-config:/app/config
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aichat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aichat-config:
