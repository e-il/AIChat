services:
  backend:
    build:
      context: ./backend/AIChat.Api
      dockerfile: Dockerfile
    container_name: aichat-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_OPENAI_API_KEY}
    volumes:
      # Bind mount for config (users.json, models.json) — source files live on the host
      # so edits in the repo are reflected in the container without rebuilding.
      - ./backend/AIChat.Api/config:/app/config
      # Memory files (one JSON per user). Must persist across container rebuilds.
      - aichat-memory:/app/data/memory
      # Generated + uploaded images, scoped per user. Must persist across container rebuilds.
      - aichat-images:/app/data/images
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aichat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aichat-memory:
  aichat-images:
